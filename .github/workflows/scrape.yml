name: Weekly Scrape & Benefits Update

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pypdf pdfplumber pytest

      - name: Run Dedicated Max 15% PDF Scraper
        run: |
          python3 scripts/scrape_max_pdf.py

      - name: Run Dedicated UNIQ Website Scraper
        run: |
          python3 scripts/scrape_uniq_site.py

      - name: Cross-Reference Datasets
        run: |
          python3 scripts/scraper.py

      - name: Run Data Integrity Tests
        run: |
          pytest tests/test_scraper_data.py

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/rechargeable_benefits.json public/data/scraped_benefits.json
          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "chore(data): auto-update UNIQ club and Max PDF benefits datasets [skip ci]"
            git push
          fi
