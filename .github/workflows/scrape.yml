name: Weekly Scrape & Benefits Update

on:
  schedule:
    # Runs daily at 03:00 UTC to keep benefits fresh
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pypdf pdfplumber pytest requests

      - name: Run Dedicated Max 15% PDF Scraper
        run: |
          python3 scripts/scrape_max_pdf.py

      - name: Run Dedicated UNIQ Website Scraper
        run: |
          python3 scripts/scrape_uniq_site.py

      - name: Cross-Reference Datasets
        run: |
          python3 scripts/scraper.py

      - name: Run Data Integrity Tests
        run: |
          pytest tests/test_scraper_data.py

      - name: Commit & Push Changes Locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/rechargeable_benefits.json public/data/scraped_benefits.json
          if git diff --staged --quiet; then
            echo "No data changes detected locally."
          else
            git commit -m "chore(data): auto-update UNIQ club and Max PDF benefits datasets [skip ci]"
            git push
          fi

      - name: Checkout Master Repo (Behatsdaa-site-ai-mesh)
        uses: actions/checkout@v4
        with:
          repository: 'elonuziel/Behatsdaa-site-ai-mesh'
          token: ${{ secrets.MASTER_REPO_PAT }}
          path: 'master-repo'
          ref: 'main'

      - name: Push Updated UNIQ Data to Master Repo
        run: |
          mkdir -p master-repo/data/sources/uniq
          cp public/data/rechargeable_benefits.json master-repo/data/sources/uniq/rechargeable_benefits.json
          cp public/data/scraped_benefits.json master-repo/data/sources/uniq/scraped_benefits.json

          cd master-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet data/sources/uniq/; then
            echo "No data changes for UNIQ in master repo."
          else
            echo "Pushing updated UNIQ benefits to master repo..."
            git add data/sources/uniq/
            git commit -m "chore(data): auto-sync latest UNIQ benefits from scraper"
            git push origin main
            echo "Successfully pushed to master repo!"
          fi
